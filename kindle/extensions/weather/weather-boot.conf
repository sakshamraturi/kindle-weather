# Starts the weather dashboard after the Kindle UI is up, if autostart is on in KUAL.
start on started framework
task
script
    [ -f /mnt/us/extensions/weather/autostart ] || exit 0
    # Wait for the home screen, and leave a window to open KUAL and turn autostart off.
    sleep 90
    sh /mnt/us/extensions/weather/start.sh
end script
